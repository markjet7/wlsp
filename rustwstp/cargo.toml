[package]
name = "rustwstp"
version = "0.1.0"
authors = ["Mark Mba Wright <markmw@markmba.com>"]
edition = "2021"

[dependencies]
wolfram-app-discovery = "0.4.9"
wstp = "0.2.9"
wolfram-expr= "0.1.4"
tower = "0.5.2"
tower-lsp = "0.20.0"
tower-lsp-macros = "0.9.0"
once_cell = "1.21.0"
serde = "1.0.219"
serde_json = "1.0.140"                                 
tokio = { version = "1.44.0", features = ["full"] }

[[bin]]
name = "rustwstp"
path = "src/main.rs"

[env]
WOLFRAM_APP_DIRECTORY = "/Applications/Wolfram.app"

[patch.crates-io]
wstp-sys = { git = "https://github.com/markjet7/wstp-rs", branch = "master" }